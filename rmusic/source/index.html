    <title>R music</title>
    <script src="/rmusic/runtime-config.js"></script>
    <style>
      html, body { background:#09090b; }
      #app-splash { position:fixed; inset:0; z-index:2147483647; display:grid; place-items:center; background:#09090b; color:#f1f7f5; opacity:1; transition:opacity 320ms ease; pointer-events:none; }
      #app-splash.is-hiding { opacity:0; }
      .app-splash-inner { display:flex; flex-direction:column; align-items:center; gap:20px; opacity:0; animation:splash-in 400ms ease 180ms forwards; }
      .app-splash-icon { width:clamp(88px,20vw,124px); height:auto; }
      .app-splash-title { font:600 clamp(26px,7vw,38px)/1.15 system-ui,-apple-system,sans-serif; letter-spacing:-.04em; }
      .app-splash-wave { display:flex; align-items:center; gap:5px; height:18px; }
      .app-splash-wave span { width:3px; height:100%; border-radius:3px; background:#8be5c4; animation:splash-wave 1s ease-in-out infinite alternate; transform:scaleY(.3); }
      .app-splash-wave span:nth-child(2n) { animation-delay:-.4s; }
      .app-splash-wave span:nth-child(3n) { animation-delay:-.7s; }
      @keyframes splash-in { to { opacity:1; } }
      @keyframes splash-wave { to { transform:scaleY(1); } }
      @media (prefers-reduced-motion:reduce) { .app-splash-inner { opacity:1; animation:none; } .app-splash-wave span { animation:none; } }
    </style>
  </head>
  <body>
    <img src="/rmusic/share-cover.png?v=3" alt="" width="300" height="300" aria-hidden="true" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none" />
    <div id="app-splash" role="status" aria-live="polite" aria-label="正在载入R music">
      <div class="app-splash-inner">
        <img class="app-splash-icon" src="/rmusic/icon.svg?v=3" alt="" width="512" height="512" />
        <div class="app-splash-title">R music</div>
        <div class="app-splash-wave" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>

name: ChatGPT Li Zhi Missing Covers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-lizhi-covers.yml'

permissions:
  contents: read

jobs:
  extras:
    runs-on: ubuntu-latest
    steps:
      - name: Download remaining covers
        shell: bash
        run: |
          set -u
          mkdir -p extras
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'

          curl -fL -A "$ua" -e "https://www.shopmsdn.com/" --retry 3 "https://www.shopmsdn.com/upload/cover/20150711215305.jpg" -o "extras/2007 - 将进酒.jpg" || true
          curl -fL --retry 3 "https://raw.githubusercontent.com/nj-lizhi/song/main/audio/%E6%88%91%E4%BB%AC%E4%B9%9F%E7%88%B1%E5%8D%97%E4%BA%AC/cover.png" -o "extras/2011 - 我们也爱南京.png"
          curl -fL --retry 3 "https://shop.panda-record.co.jp/resources/upload/products/00_BRANCD005_6_Lizhi_jacket_square.png" -o "extras/2019 - Best Selection Songs 2004-2018.png"
          curl -fL --retry 3 "https://pbs.twimg.com/media/EbbFGb8U0AAURtc.jpg?name=orig" -o "extras/2020 - Best Selection Songs 2004-2018 Vol.2 - Ballads（叙事歌）.jpg"
          curl -fL --retry 3 "https://coverartarchive.org/release/f441c560-c866-410a-a53e-432f3e69b809/40455825102.jpg" -o "extras/2021 - Best Selection Songs 2004-2018 Vol.3 - 倒影.jpg"
          curl -fL --retry 3 "https://shop.panda-record.co.jp/resources/upload/products/368.png" -o "extras/2025 - THREE MISSING ONE JAPAN Tour 2024 in Tokyo.png"

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          for p in sorted(Path("extras").iterdir()):
              try:
                  with Image.open(p) as im:
                      print(p.name, im.format, im.size, p.stat().st_size)
              except Exception as e:
                  print("BAD", p.name, repr(e))
          PY

      - name: Upload extras
        uses: actions/upload-artifact@v4
        with:
          name: lizhi-missing-covers
          path: extras/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

name: ChatGPT Li Zhi Album Covers One Shot

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/chatgpt-lizhi-covers.yml'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Download high resolution album covers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p covers

          curl -fL --retry 4 --retry-delay 2 "https://is1-ssl.mzstatic.com/image/thumb/Music124/v4/72/49/c5/7249c574-94f5-da88-a31f-16b002dafa04/9787798627183.jpg/3000x3000bb.jpg" -o "covers/2004 - 被禁忌的游戏.jpg"
          curl -fL --retry 4 --retry-delay 2 "https://is1-ssl.mzstatic.com/image/thumb/Music114/v4/a8/c8/4f/a8c84f2b-cdc2-bb6a-ff90-dbc736e83d60/9787798627176.jpg/3000x3000bb.jpg" -o "covers/2005 - 梵高先生.jpg"
          curl -fL --retry 4 --retry-delay 2 "https://is1-ssl.mzstatic.com/image/thumb/Music114/v4/15/65/79/15657986-6399-118e-e460-c3b0f8284536/9555150725323.jpg/3000x3000bb.jpg" -o "covers/2006 - 这个世界会好吗.jpg"
          curl -fL --retry 4 --retry-delay 2 "https://is1-ssl.mzstatic.com/image/thumb/Music114/v4/34/9f/e7/349fe7c3-b573-393c-9b05-4d7edc23b9f8/9555150725316.jpg/3000x3000bb.jpg" -o "covers/2009 - 工体东路没有人.jpg"
          curl -fL --retry 4 --retry-delay 2 "https://is1-ssl.mzstatic.com/image/thumb/Music115/v4/b8/0e/3d/b80e3d10-de05-28ab-b3d3-2e815de0482f/9787880973792.jpg/3000x3000bb.jpg" -o "covers/2009 - 我爱南京.jpg"
          curl -fL --retry 4 --retry-delay 2 "https://i.audiomack.com/LiZhi/6b9d213375.webp?width=1200" -o "covers/2010 - 二零零九年十月十六日事件.jpg"
          curl -fL --retry 4 --retry-delay 2 "https://is1-ssl.mzstatic.com/image/thumb/Music124/v4/ac/18/e5/ac18e537-3cc4-7b13-5d03-95b1fa97ccef/9787798608441.jpg/3000x3000bb.jpg" -o "covers/2010 - 你好，郑州.jpg"
          curl -fL --retry 4 --retry-delay 2 "https://is1-ssl.mzstatic.com/image/thumb/Music114/v4/42/e4/ba/42e4baea-a788-4ec9-3d03-f1dfa2674b96/9787883255154.jpg/3000x3000bb.jpg" -o "covers/2011 - F.jpg"
          curl -fL --retry 4 --retry-delay 2 "https://i.audiomack.com/LiZhi/aa87fff080.webp?width=1200" -o "covers/2012 - IMAGINE.jpg"
          curl -fL --retry 4 --retry-delay 2 "https://is1-ssl.mzstatic.com/image/thumb/Music114/v4/3c/b6/73/3cb67316-a838-ded6-3bd9-3bcd1c7712c8/9555150725309.jpg/3000x3000bb.jpg" -o "covers/2013 - 108个关键词.jpg"
          curl -fL --retry 4 --retry-delay 2 "https://is1-ssl.mzstatic.com/image/thumb/Music114/v4/6a/52/36/6a5236f5-8f6f-99d1-9646-4c8c401125a9/9787883256281.jpg/3000x3000bb.jpg" -o "covers/2014 - 勾三搭四.jpg"
          curl -fL --retry 4 --retry-delay 2 "https://is1-ssl.mzstatic.com/image/thumb/Music114/v4/93/cf/40/93cf4004-3469-dfc1-6586-aac1ff1dc13a/9787883257196.jpg/3000x3000bb.jpg" -o "covers/2014 - 1701.jpg"
          curl -fL --retry 4 --retry-delay 2 "https://is1-ssl.mzstatic.com/image/thumb/Music124/v4/cc/b3/4b/ccb34b31-a776-4f45-32fa-e60c6cde7547/9555150725293.jpg/3000x3000bb.jpg" -o "covers/2015 - i-O.jpg"
          curl -fL --retry 4 --retry-delay 2 "https://is1-ssl.mzstatic.com/image/thumb/Music124/v4/04/32/2b/04322b0d-782e-b58b-6088-6fc607504796/9555150725286.jpg/3000x3000bb.jpg" -o "covers/2015 - 看见.jpg"
          curl -fL --retry 4 --retry-delay 2 "https://is1-ssl.mzstatic.com/image/thumb/Music124/v4/d2/1d/f8/d21df867-33cb-0550-09b6-dd2e3ff47b54/9555150725255.jpg/3000x3000bb.jpg" -o "covers/2016 - 動靜.jpg"
          curl -fL --retry 4 --retry-delay 2 "https://is1-ssl.mzstatic.com/image/thumb/Music114/v4/33/26/be/3326be73-7a55-aec9-6af0-3e7731b0d2e0/9555150725262.jpg/3000x3000bb.jpg" -o "covers/2016 - 8（捌）.jpg"
          curl -fL --retry 4 --retry-delay 2 "https://is1-ssl.mzstatic.com/image/thumb/Music124/v4/43/d3/dc/43d3dc0a-0913-f9ff-4448-9b8b89e03c58/9555150725248.jpg/3000x3000bb.jpg" -o "covers/2016 - 李志北京不插电现场.jpg"
          curl -fL --retry 4 --retry-delay 2 "https://is1-ssl.mzstatic.com/image/thumb/Music124/v4/5e/d0/d4/5ed0d4a0-317e-bcfe-cce0-faed3f3d94f5/9787883302223.jpg/3000x3000bb.jpg" -o "covers/2016 - 在每一条伤心的应天大街上.jpg"
          curl -fL --retry 4 --retry-delay 2 "https://is1-ssl.mzstatic.com/image/thumb/Music114/v4/07/ec/9a/07ec9a71-3a9b-bf7a-9697-1795b4d0254f/9787883303626.jpg/3000x3000bb.jpg" -o "covers/2017 - 李志、电声与管弦乐.jpg"
          curl -fL --retry 4 --retry-delay 2 "https://is1-ssl.mzstatic.com/image/thumb/Music124/v4/49/46/66/494666a7-1429-fe2f-f074-da837a48b70d/9787883306955.jpg/3000x3000bb.jpg" -o "covers/2018 - 爵士乐与不插电新编12首.jpg"
          curl -fL --retry 4 --retry-delay 2 "https://is1-ssl.mzstatic.com/image/thumb/Music114/v4/26/2f/e1/262fe181-f1e0-cb6f-9914-2ab0f0944169/9787883306948.jpg/3000x3000bb.jpg" -o "covers/2018 - 李志、电声与管弦乐II.jpg"

          printf '%s\n' \
            '李志主要公开发行专辑 / 现场专辑封面整理' \
            '' \
            '- Apple Music 可用条目：直接下载其 3000×3000 artwork 资源。' \
            '- 《二零零九年十月十六日事件》《IMAGINE》：Apple Music 当前未提供对应条目，采用公开流媒体可取得的高清封面资源。' \
            '- 文件名按作品首次发行年份整理；部分 Apple Music 页面显示的是后续数字发行/再版年份，因此未直接照抄其 releaseDate。' \
            '- 未对图片进行 AI 放大、锐化或二次压缩。' \
            > "covers/说明.txt"

          python3 -c 'from pathlib import Path; import zipfile; src=Path("covers"); out=Path("李志_专辑封面_高清.zip"); z=zipfile.ZipFile(out,"w",compression=zipfile.ZIP_STORED); [z.write(p,arcname=p.name) for p in sorted(src.iterdir(),key=lambda x:x.name)]; z.close(); print(out, out.stat().st_size)'

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: lizhi-album-covers-hq
          path: 李志_专辑封面_高清.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
